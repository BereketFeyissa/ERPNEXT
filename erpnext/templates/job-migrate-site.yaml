{{- if .Values.jobs.migrate.enabled }}
{{- $parallelism := int .Values.jobs.migrate.parallelism }}
{{- if lt $parallelism 1 }}
{{- fail "jobs.migrate.parallelism must be at least 1" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- if .Values.jobs.migrate.jobName }}
  name: {{ .Values.jobs.migrate.jobName }}
  {{- else }}
  name: {{ template "erpnext.fullname" . }}-migrate-{{ now | date "20060102150405" }}
  {{- end }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
  {{- with .Values.jobs.migrate.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.jobs.migrate.backoffLimit }}
  template:
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ template "erpnext.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
      - name: migrate
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["bash", "-c"]
        args:
          - |
            set -e
            # Flush bench output line by line so it reaches the pod log while the migration runs.
            export PYTHONUNBUFFERED=1
            list_sites() {
              {{- include "erpnext.migrate.siteList" . | nindent 14 }}
            }
            # All job state lives in shell variables, so nothing is written to the container filesystem
            # and the job works with a read-only root filesystem.
            # `wait -n -p` (used below) needs bash 5.1+.
            if (( BASH_VERSINFO[0] * 100 + BASH_VERSINFO[1] < 501 )); then
              echo "bash 5.1 or newer is required, found $BASH_VERSION"
              exit 1
            fi
            mapfile -t sites < <(list_sites)
            echo "Migrating ${#sites[@]} site(s), {{ $parallelism }} at a time"

            # Output is streamed live with a [site] prefix. Returns non-zero if the site failed;
            # a failed site stays in maintenance mode.
            migrate_site() {
              set -o pipefail
              local site="$1"
              { bench --site "$site" set-maintenance-mode on \
                && bench --site "$site" migrate{{ if .Values.jobs.migrate.skipFailing }} --skip-failing{{ end }} \
                && bench --site "$site" set-maintenance-mode off; } 2>&1 | sed -u "s|^|[$site] |"
            }

            ok=()
            failed=()
            declare -A running=()  # pid -> site
            # Waits for the next running migration to finish and records its result.
            collect_one() {
              local pid code=0 site
              wait -n -p pid "${!running[@]}" || code=$?
              site="${running[$pid]}"
              unset "running[$pid]"
              if [ "$code" -eq 0 ]; then
                echo "[OK] $site"
                ok+=("$site")
              else
                echo "[FAILED] $site (exit code $code, left in maintenance mode)"
                failed+=("$site")
              fi
            }
            for site in "${sites[@]}"; do
              if [ "${#running[@]}" -ge {{ $parallelism }} ]; then collect_one; fi
              migrate_site "$site" &
              running[$!]="$site"
            done
            while [ "${#running[@]}" -gt 0 ]; do collect_one; done

            # Failures that are not a single site's migration, kept for the summary.
            other_failures=()
            record_failure() { echo "[FAILED] $1"; other_failures+=("$1"); }
            {{- if .Values.jobs.migrate.enableCacheFlush }}
            # Both commands always run, whatever the migration result or the other command's result.
            # A failure fails the job, but only after the summary below.
            echo "Clearing website cache and cache for all sites..."
            bench --site all clear-website-cache \
              || record_failure "bench --site all clear-website-cache (exit code $?)"
            bench --site all clear-cache \
              || record_failure "bench --site all clear-cache (exit code $?)"
            {{- end }}

            # Prints "  <label>: N site(s): a b c" when at least one site is given.
            print_sites() {
              local label="$1"
              shift
              if [ "$#" -gt 0 ]; then echo "  $label: $# site(s): $*"; fi
            }
            echo "Summary: ${#ok[@]} of ${#sites[@]} site(s) migrated"
            print_sites "Migrated" "${ok[@]}"
            print_sites "Migration failed, left in maintenance mode" "${failed[@]}"
            for failure in "${other_failures[@]}"; do echo "  Failed: $failure"; done
            if [ "${#failed[@]}" -gt 0 ] || [ "${#other_failures[@]}" -gt 0 ]; then
              exit 1
            fi
        resources:
          {{- toYaml .Values.jobs.migrate.resources | nindent 10 }}
        securityContext:
          {{- toYaml $.Values.securityContext | nindent 10 }}
        volumeMounts:
          - name: sites-dir
            mountPath: /home/frappe/frappe-bench/sites
          - name: logs
            mountPath: /home/frappe/frappe-bench/logs
      restartPolicy: Never
      volumes:
        - name: sites-dir
          {{- if .Values.persistence.worker.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.worker.existingClaim }}
            claimName: {{ .Values.persistence.worker.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.logs.existingClaim }}
            claimName: {{ .Values.persistence.logs.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}-logs
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.jobs.migrate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.migrate.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.migrate.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

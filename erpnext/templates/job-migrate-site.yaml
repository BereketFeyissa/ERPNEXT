{{- if .Values.jobs.migrate.enabled }}
{{- $parallelism := int .Values.jobs.migrate.parallelism }}
{{- if lt $parallelism 1 }}
{{- fail "jobs.migrate.parallelism must be at least 1" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- if .Values.jobs.migrate.jobName }}
  name: {{ .Values.jobs.migrate.jobName }}
  {{- else }}
  name: {{ template "erpnext.fullname" . }}-migrate-{{ now | date "20060102150405" }}
  {{- end }}
  labels:
    {{- include "erpnext.labels" . | nindent 4 }}
  {{- with .Values.jobs.migrate.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.jobs.migrate.backoffLimit }}
  template:
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ template "erpnext.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
      - name: migrate
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["bash", "-c"]
        args:
          - |
            set -e
            # Flush bench output line by line so it reaches the pod log while the migration runs.
            export PYTHONUNBUFFERED=1
            list_sites() {
              {{- include "erpnext.migrate.siteList" . | nindent 14 }}
            }
            list_sites > /tmp/sites.txt
            : > /tmp/failed.txt
            echo "Migrating $(wc -l < /tmp/sites.txt) site(s), {{ $parallelism }} at a time"

            # Output is streamed live with a [site] prefix. A site whose migration fails
            # stays in maintenance mode; the others continue.
            migrate_site() {
              set -o pipefail
              local site="$1"
              if { bench --site "$site" set-maintenance-mode on \
                && bench --site "$site" migrate{{ if .Values.jobs.migrate.skipFailing }} --skip-failing{{ end }} \
                && bench --site "$site" set-maintenance-mode off; } 2>&1 | sed -u "s|^|[$site] |"; then
                echo "[OK] $site"
              else
                echo "[FAILED] $site (left in maintenance mode)"
                echo "$site" >> /tmp/failed.txt
              fi
            }
            export -f migrate_site
            exit_code=0
            # Not left to set -e: a worker killed mid-migration must not skip the cache clear below.
            xargs -r -P {{ $parallelism }} -I{} bash -c 'migrate_site "$1"' _ {} < /tmp/sites.txt \
              || { echo "[FAILED] migration workers (xargs exit code $?)"; exit_code=1; }
            {{- if .Values.jobs.migrate.enableCacheFlush }}
            # Both commands always run, whatever the migration result or the other command's result.
            # A failure fails the job, but only after the migration summary below.
            echo "Clearing website cache and cache for all sites..."
            bench --site all clear-website-cache \
              || { echo "[FAILED] bench --site all clear-website-cache (exit code $?)"; exit_code=1; }
            bench --site all clear-cache \
              || { echo "[FAILED] bench --site all clear-cache (exit code $?)"; exit_code=1; }
            {{- end }}
            if [ -s /tmp/failed.txt ]; then
              echo "Migration failed for $(wc -l < /tmp/failed.txt) site(s):"
              cat /tmp/failed.txt
              exit_code=1
            fi
            exit $exit_code
        resources:
          {{- toYaml .Values.jobs.migrate.resources | nindent 10 }}
        securityContext:
          {{- toYaml $.Values.securityContext | nindent 10 }}
        volumeMounts:
          - name: sites-dir
            mountPath: /home/frappe/frappe-bench/sites
          - name: logs
            mountPath: /home/frappe/frappe-bench/logs
      restartPolicy: Never
      volumes:
        - name: sites-dir
          {{- if .Values.persistence.worker.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.worker.existingClaim }}
            claimName: {{ .Values.persistence.worker.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: logs
          {{- if .Values.persistence.logs.enabled }}
          persistentVolumeClaim:
            {{- if .Values.persistence.logs.existingClaim }}
            claimName: {{ .Values.persistence.logs.existingClaim }}
            {{- else }}
            claimName: {{ template "erpnext.fullname" . }}-logs
            {{- end }}
            readOnly: false
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.jobs.migrate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.migrate.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.migrate.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
